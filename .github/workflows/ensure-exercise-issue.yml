name: Ensure Exercise Issue Exists

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  ensure_issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure exercise issue exists
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE_PREFIX: ${{ secrets.ISSUE_TITLE_PREFIX || 'Exercise' }}
        with:
          script: |
            const core = require('@actions/core');
            const { context, github } = require('@actions/github');
            core.startGroup('Find or create exercise issue');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prefix = process.env.ISSUE_TITLE_PREFIX || 'Exercise';

            // list open issues (first 100)
            let listResp;
            try {
              listResp = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
            } catch (err) {
              core.warning(`Could not list issues: ${err.message}`);
              core.endGroup();
              core.setOutput('exercise_issue_found', 'false');
              return;
            }

            const issues = listResp.data || [];
            let issue = issues.find(i => i.title && i.title.includes(prefix));

            if (issue) {
              core.info(`Exercise issue found: #${issue.number} (${issue.html_url})`);
              core.setOutput('exercise_issue_found', 'true');
              core.setOutput('exercise_issue_number', issue.number);
            } else {
              core.info('No exercise issue found — attempting to create one');
              try {
                const createResp = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `${prefix} — Setup Issue`,
                  body: 'Auto-created by CI to satisfy exercise workflow.',
                });
                issue = createResp.data;
                core.info(`Created exercise issue: #${issue.number} (${issue.html_url})`);
                core.setOutput('exercise_issue_found', 'true');
                core.setOutput('exercise_issue_number', issue.number);
              } catch (err) {
                core.warning(`Could not create issue: ${err.message}`);
                core.warning('Continuing without failing — please enable issues or grant permissions if you want automatic creation.');
                core.setOutput('exercise_issue_found', 'false');
              }
            }

            core.endGroup();
